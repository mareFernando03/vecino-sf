# La app web (estáticos + proxy a la API). Escala igual que la API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: vecino-sf
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: vecino-sf/web:1.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
          volumeMounts: [{ name: nginx, mountPath: /etc/nginx/conf.d }]
      volumes:
        - name: nginx
          configMap: { name: web-nginx }
---
# En Kubernetes la API se alcanza por su Service (que ya reparte entre réplicas), así que
# el nginx.conf de Docker se reemplaza por esta versión.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: vecino-sf
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        client_max_body_size 21m;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
        location = /sw.js { add_header Cache-Control "no-cache"; }
        location = /api/eventos {
            proxy_pass http://api.vecino-sf.svc.cluster.local:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
            access_log off;          # la URL lleva el token de sesión
        }
        location /api/ {
            proxy_pass http://api.vecino-sf.svc.cluster.local:8000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
        }
        location / { try_files $uri /index.html; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: vecino-sf
spec:
  selector: { app: web }
  ports: [{ port: 80 }]
---
# Entrada pública con HTTPS (el certificado lo emite cert-manager con Let's Encrypt).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vecino
  namespace: vecino-sf
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [vecino.example.gob.ar]
      secretName: vecino-tls
  rules:
    - host: vecino.example.gob.ar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
