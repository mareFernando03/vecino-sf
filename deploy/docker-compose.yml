# Todo el sistema en una máquina, con la misma forma que en Kubernetes:
#   docker compose up -d --build        →  http://localhost:8080 (app), :3000 (Grafana), :9090 (Prometheus)
#   docker compose up -d --scale api=6  (escalar el backend en caliente)
name: vecino-sf

x-entorno: &entorno
  DATABASE_URL: postgresql+psycopg://vecino:vecino@postgres:5432/vecino
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: cambiar-en-produccion
  VAPID_FILE: /compartido/vapid.json

services:
  postgres:
    image: postgres:16.4-alpine
    environment: { POSTGRES_USER: vecino, POSTGRES_PASSWORD: vecino, POSTGRES_DB: vecino }
    volumes: [datos:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vecino"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine

  api:
    build: ../backend
    environment: *entorno
    volumes: [compartido:/compartido, adjuntos:/datos/adjuntos]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    deploy:
      replicas: 3
      resources: { limits: { cpus: "1", memory: 384M } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 5s
      retries: 5

  # Una sola instancia: sensores simulados y avisos programados.
  simulador:
    build: ../backend
    command: ["python", "-m", "app.simulador"]
    environment: *entorno
    volumes: [compartido:/compartido]
    depends_on: [api]

  web:
    build: ../frontend
    ports: ["8080:80"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  datos:
  compartido:
  adjuntos:
