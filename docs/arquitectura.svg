<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="8" y="8" width="1084" height="150" rx="10" fill="#eaf6ef" stroke="#2e8b57" stroke-width="2"/><text x="22" y="32" font-size="15" font-weight="700" fill="#2e8b57" text-anchor="start">CLIENTES · una app web progresiva (Ionic + React), empaquetable con Capacitor</text><rect x="20.0" y="48" width="346.6666666666667" height="96" rx="6" fill="#fff" stroke="#2e8b57" stroke-width="1.5"/><text x="193.33333333333334" y="86.0" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">App ciudadana</text><text x="193.33333333333334" y="104.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">registro de residuos, retiros</text><text x="193.33333333333334" y="119.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">especiales, puntos, avisos</text><rect x="376.6666666666667" y="48" width="346.6666666666667" height="96" rx="6" fill="#fff" stroke="#2e8b57" stroke-width="1.5"/><text x="550.0" y="86.0" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">Panel de autoridades</text><text x="550.0" y="104.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">mapa en tiempo real, rutas,</text><text x="550.0" y="119.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">incidentes, campañas, QR</text><rect x="733.3333333333334" y="48" width="346.6666666666667" height="96" rx="6" fill="#fff" stroke="#2e8b57" stroke-width="1.5"/><text x="906.6666666666667" y="86.0" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">App de recolección</text><text x="906.6666666666667" y="104.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">ruta asignada, escaneo QR</text><text x="906.6666666666667" y="119.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">con la cámara, incidentes</text><rect x="8" y="196" width="1084" height="92" rx="10" fill="#eef3fa" stroke="#3b6fb6" stroke-width="2"/><text x="22" y="220" font-size="15" font-weight="700" fill="#3b6fb6" text-anchor="start">BORDE</text><rect x="140" y="226" width="360" height="52" rx="6" fill="#fff" stroke="#3b6fb6" stroke-width="1.5"/><text x="320.0" y="249.5" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">Ingress HTTPS</text><text x="320.0" y="267.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">cert-manager + Let's Encrypt</text><rect x="600" y="226" width="360" height="52" rx="6" fill="#fff" stroke="#3b6fb6" stroke-width="1.5"/><text x="780.0" y="249.5" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">web (nginx) × 2</text><text x="780.0" y="267.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">estáticos + balanceo de /api + SSE</text><line x1="193.33333333333334" y1="146" x2="193.33333333333334" y2="224" stroke="#444" stroke-width="2" marker-start="url(#flecha)" marker-end="url(#flecha)"/><line x1="550.0" y1="146" x2="550.0" y2="224" stroke="#444" stroke-width="2" marker-start="url(#flecha)" marker-end="url(#flecha)"/><line x1="906.6666666666667" y1="146" x2="906.6666666666667" y2="224" stroke="#444" stroke-width="2" marker-start="url(#flecha)" marker-end="url(#flecha)"/><text x="730" y="186" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">HTTPS · token JWT · eventos SSE</text><line x1="500" y1="252" x2="598" y2="252" stroke="#444" stroke-width="2" marker-end="url(#flecha)"/><rect x="8" y="324" width="1084" height="330" rx="10" fill="#f6f1fb" stroke="#7a4fb0" stroke-width="2"/><text x="22" y="348" font-size="15" font-weight="700" fill="#7a4fb0" text-anchor="start">CLÚSTER KUBERNETES · namespace vecino-sf</text><rect x="30" y="362" width="380" height="120" rx="6" fill="#fff" stroke="#7a4fb0" stroke-width="1.5"/><text x="220.0" y="404.5" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">api × 3 a 20 réplicas</text><text x="220.0" y="422.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">FastAPI · sin estado · /salud · /metrics</text><text x="220.0" y="437.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">readiness y liveness probes</text><text x="220.0" y="452.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">PodDisruptionBudget: mínimo 2</text><rect x="460" y="362" width="230" height="120" rx="6" fill="#fff" stroke="#7a4fb0" stroke-width="1.5"/><text x="575.0" y="404.5" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">HorizontalPodAutoscaler</text><text x="575.0" y="422.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">objetivo 60 % de CPU</text><text x="575.0" y="437.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">sube +100 % cada 30 s</text><text x="575.0" y="452.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">baja 1 pod por minuto</text><rect x="720" y="362" width="350" height="120" rx="6" fill="#fff" stroke="#7a4fb0" stroke-width="1.5"/><text x="895.0" y="404.5" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">simulador × 1</text><text x="895.0" y="422.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">sensores de llenado y bicicletas</text><text x="895.0" y="437.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">avisos programados (vencimientos)</text><text x="895.0" y="452.5" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">en producción: IoT / CronJob</text><rect x="30" y="520" width="300" height="110" rx="6" fill="#fff" stroke="#7a4fb0" stroke-width="1.5"/><text x="180.0" y="565.0" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">PostgreSQL</text><text x="180.0" y="583.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">StatefulSet + volumen persistente</text><text x="180.0" y="598.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">(en la nube: servicio administrado)</text><rect x="360" y="520" width="300" height="110" rx="6" fill="#fff" stroke="#7a4fb0" stroke-width="1.5"/><text x="510.0" y="565.0" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">Redis pub/sub</text><text x="510.0" y="583.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">reparte los eventos en tiempo real</text><text x="510.0" y="598.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">entre todas las réplicas</text><rect x="690" y="520" width="180" height="110" rx="6" fill="#fff" stroke="#7a4fb0" stroke-width="1.5"/><text x="780.0" y="565.0" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">metrics-server</text><text x="780.0" y="583.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">CPU por pod</text><text x="780.0" y="598.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">para el HPA</text><rect x="890" y="520" width="180" height="110" rx="6" fill="#fff" stroke="#7a4fb0" stroke-width="1.5"/><text x="980.0" y="565.0" font-size="14.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">Prometheus</text><text x="980.0" y="583.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">lee /metrics de cada</text><text x="980.0" y="598.0" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">pod de api (anotación)</text><line x1="780" y1="278" x2="300" y2="360" stroke="#444" stroke-width="2" marker-end="url(#flecha)"/><text x="500.0" y="311.0" font-size="12" font-weight="600" fill="#444" text-anchor="start">/api</text><line x1="180" y1="482" x2="180" y2="518" stroke="#444" stroke-