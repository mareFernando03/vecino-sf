# Balanceador y servidor web. "api" resuelve a todas las réplicas del backend.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 21m;          # 4 adjuntos de 5 MB por reclamo

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los archivos con hash en el nombre no cambian nunca: caché de un año.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # El service worker se revisa siempre, para que una versión nueva llegue enseguida.
    location = /sw.js { add_header Cache-Control "no-cache"; }

    # Tiempo real: la conexión queda abierta y nginx no debe acumular la respuesta.
    location = /api/eventos {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        access_log off;            # la URL lleva el token de sesión: no se escribe en el log
    }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    # Aplicación de una sola página: cualquier otra ruta devuelve index.html.
    location / { try_files $uri /index.html; }
}
